[project]
name = "ai-trading"
version = "0.1.0"
description = "AI Forex SMC trading system — data foundation (MT5 collector, stores, normalization)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "lightgbm>=4.7.0",
    "metatrader5==5.0.6147",
    "openai>=3.8.0",
    "pandas>=3.0,<4",
    "plotly>=5.23",
    "pyarrow>=25.0.1",
    "scikit-learn>=1.9.0",
    "streamlit>=1.39",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_trading"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = '-m "not mt5 and not llm and not streamlit"'
markers = [
    "unit: fast tests with no MT5 dependency",
    "mt5: integration tests requiring a running, logged-in MT5 terminal",
    "llm: integration tests requiring a live OpenAI-compatible LLM endpoint (opt-in)",
    "streamlit: Streamlit AppTest dashboard tests (opt-in; run via the explicit -m streamlit selector)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]
